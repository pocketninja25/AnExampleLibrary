name: ci

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_NOLOGO: true
  Configuration: Debug
  NuGetDirectory: ${{ github.workspace }}/nuget

on:
  workflow_dispatch: # Allow running the workflow manually from the GitHub UI
    inputs:
          publish:
            type: boolean
            description: Publish generated packages
  push:
    branches: ['main']
    paths-ignore: ['docs/**', '**/*.md']
  pull_request:
    branches: ['*']
    paths-ignore: ['docs/**', '**/*.md']
  release:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      issues: read
      checks: write
      pull-requests: write
  
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0 # avoid shallow clone so nbgv can do its work.
    - name: Setup dotnet
      uses: actions/setup-dotnet@v4 # Use version in global.json
    - name: Setup semantic versioning
      uses: dotnet/nbgv@v0.4
      with:
        setAllVars: true
      id: nbgv
    - name: Dump semantic version info
      run: echo 'SemVer2=${{ steps.nbgv.outputs.SemVer2 }}'
    - name: Add Github Nuget source
      run: dotnet nuget add source --username USERNAME --password ${{ secrets.GITHUB_TOKEN }} --store-password-in-clear-text --name github "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"
    - name: Restore dependencies
      run: dotnet restore
    - name: Format
      run: dotnet format --verify-no-changes --verbosity diagnostic --no-restore

    - name: Build
      run: dotnet build /warnaserror --configuration ${{ env.Configuration }} --no-restore

    - uses: actions/upload-artifact@v4
      if: (github.event_name == 'release' || github.event.inputs.publish == 'true' || contains(github.event.head_commit.message, '**publish**'))
      with:
        name: nuget-packages
        if-no-files-found: error
        retention-days: 1
        path: src/**/*.nupkg

  publish:
    # Publish only when creating a release
    if: (github.event_name == 'release' || github.event.inputs.publish == 'true' || contains(github.event.head_commit.message, '**publish**'))
    runs-on: ubuntu-latest
    needs: [build]
    permissions:
      packages: write
    steps:
    - uses: actions/download-artifact@v4
      with:
        name: nuget-packages
        path: ${{ env.NuGetDirectory }}
    - name: Setup dotnet
      uses: actions/setup-dotnet@v4 # Use version in global.json
      with:
        source-url: https://nuget.pkg.github.com/${{ github.repository_owner }}
      env:
        NUGET_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - name: Publish packages
      run: |
        find ${{ env.NuGetDirectory }} -name '*${{ env.NBGV_SemVer2 }}.nupkg' | while read file; do
          echo "$file"
          dotnet nuget push $file --api-key ${{ secrets.GITHUB_TOKEN }}
        done
  
